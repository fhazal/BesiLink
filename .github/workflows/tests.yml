name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run tests
        working-directory: test
        run: python -m unittest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t besilink:ci .
      - name: Smoke test
        run: |
          out=$(timeout 60 docker run --rm besilink:ci pylink -v)
          echo "$out"
          echo "$out" | grep -q "^BesiLink $(cat VERSION)"
          timeout 60 docker run --rm besilink:ci python -c "import pylinkirc.launcher, pylinkirc.classes, pylinkirc.protocols.inspircd, pylinkirc.protocols.unreal, pylinkirc.protocols.clientbot"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
